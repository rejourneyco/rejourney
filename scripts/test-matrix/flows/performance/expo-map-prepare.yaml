appId: ${APP_ID}
name: Prepare Expo Apple Maps performance sample
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: Bottom sheet handle
    timeout: 20000
- swipe:
    start: 50%,48%
    end: 50%,95%
    duration: 450
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: Home
    timeout: 20000
- tapOn:
    id: tab-map
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: native-map
    timeout: 10000
