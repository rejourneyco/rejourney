appId: ${APP_ID}
---
- startRecording: expo-smoke
- runFlow:
    when:
      visible: .*Congratulations.*
    commands:
      # A React Native warning toast can overlap the first-run OK button on
      # Android debug builds. Dismiss the toast, then use the stable button
      # position inside the welcome sheet.
      - tapOn:
          point: 92%,89%
      - tapOn:
          point: 50%,94%
- runFlow:
    when:
      visible: Bottom sheet handle
    commands:
      - swipe:
          start: 50%,48%
          end: 50%,95%
          duration: 450
          waitToSettleTimeoutMs: 500
# Expo Router can restore the last selected tab in a development client even
# after test storage is cleared. Normalize the route before asserting Home.
- tapOn:
    point: 8%,96%
- extendedWaitUntil:
    visible: Home
    timeout: 20000
- extendedWaitUntil:
    visible: Go to Details
    timeout: 5000
- tapOn: Go to Details
- assertVisible: Details
- back
- tapOn:
    text: Replay Lab.*
- assertVisible: Beta SDK Pause
- tapOn: Pause Rejourney SDK
- tapOn: Pause Rejourney SDK
- assertVisible: SDK paused · interact now
- swipe:
    start: 50%, 78%
    end: 50%, 28%
    duration: 350
    waitToSettleTimeoutMs: 400
- scrollUntilVisible:
    element:
      text: Resume Rejourney SDK
    direction: UP
    speed: 85
    visibilityPercentage: 80
- tapOn: Resume Rejourney SDK
- tapOn: Resume Rejourney SDK
- assertVisible: SDK resumed · same session
- scrollUntilVisible:
    element:
      text: Search query
    direction: DOWN
    speed: 85
    visibilityPercentage: 80
- tapOn: Search query
- inputText: matrix-public-query
- tapOn: Display name
- eraseText
- inputText: Matrix Tester
- hideKeyboard
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: Stress.*
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: Capture stress
          timeout: 2500
- tapOn:
    id: stress-images
- repeat:
    times: 2
    commands:
      - swipe:
          start: 50%, 78%
          end: 50%, 24%
          duration: 300
          waitToSettleTimeoutMs: 300
- waitForAnimationToEnd:
    timeout: 3000
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: stress-back
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: Capture stress
          timeout: 2500
- tapOn:
    id: tab-map
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: native-map
    timeout: 10000
- repeat:
    times: 4
    commands:
      - swipe:
          start: 22%, 62%
          end: 78%, 42%
          duration: 500
          waitToSettleTimeoutMs: 450
      - swipe:
          start: 75%, 42%
          end: 28%, 68%
          duration: 420
          waitToSettleTimeoutMs: 350
- tapOn:
    id: tab-mapbox
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: Mapbox v11.*
    timeout: 15000
- tapOn: Mapbox toggle pitch
- tapOn: Mapbox fly to marker
- repeat:
    times: 2
    commands:
      - swipe:
          start: 20%, 65%
          end: 80%, 38%
          duration: 550
          waitToSettleTimeoutMs: 450
- tapOn: Mapbox reset view
- stopRecording
