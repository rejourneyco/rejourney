# Bitnami Redis Helm values for the current production Redis layout.
#
# deploy-release.sh applies this complete file with --reset-values, --atomic, and the
# exact chart version already installed in production. Chart-version changes
# must be reviewed and pinned in that script before this file is reconciled.
#
# Bitnami Sentinel topology: `replica.replicaCount` is the redis-node StatefulSet
# size. 3 nodes (fsn1, quorum-1, worker-1) with quorum=2 gives true HA — any
# single node can die and the remaining 2 can still detect failure and elect a
# new master. Preferred anti-affinity spreads pods across all three nodes.

architecture: replication

# Pin every enabled chart image by digest. Chart 25.3.11 otherwise defaults to
# mutable `latest` tags, which can produce mixed Redis versions across nodes.
image:
  digest: sha256:08863c2c3f4e051fb6139b38fa223e9c13be5033326a59bead182860d899bf98

commonConfiguration: |-
  # Enable ReJSON and RediSearch modules used by the dashboard feature set.
  loadmodule /opt/bitnami/redis/lib/redis/modules/redisearch.so
  loadmodule /opt/bitnami/redis/lib/redis/modules/rejson.so
  # Persist writes with AOF; disable RDB snapshots to avoid duplicate work.
  appendonly yes
  save ""

sentinel:
  enabled: true
  image:
    digest: sha256:ae75dd69c192a632bdeb21baa6721080be5b12347e52add922036398b47631da
  # 3-node Sentinel cluster: quorum=2 means 2 of 3 sentinels must agree master
  # is down before failover fires. With 3 nodes, any single node can die and
  # the remaining 2 still meet both quorum (detection) and election majority
  # (floor(3/2)+1=2). quorum=1 was wrong for 2 nodes — detection worked but
  # the election always needed majority=2 of 2, which fails when one node dies.
  quorum: 2
  # Bitnami's `resourcesPreset` ("nano" by default) silently overrides `resources:` —
  # must be set to "none" for our explicit limits below to take effect.
  resourcesPreset: "none"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

replica:
  replicaCount: 3
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: redis
            topologyKey: kubernetes.io/hostname
  configuration: |
    # BullMQ stores durable queue/job state in Redis. Never evict queue keys.
    maxmemory 2gb
    maxmemory-policy noeviction
    # commonConfiguration intentionally keeps RDB disabled. Do not override it
    # per role: background snapshots duplicate AOF durability and can cause
    # avoidable fork/I/O spikes on multi-gigabyte queue datasets.
  # In Sentinel mode the redis-node StatefulSet reads resources from the
  # replica block, even when the single pod is acting as the master.
  resourcesPreset: "none"
  resources:
    requests:
      cpu: 75m
      memory: 512Mi
    limits:
      cpu: "1500m"
      memory: 3Gi

global:
  # Safe Phase 1 prep: changing this does not move the existing live PVC.
  # Redis will only switch storage classes after the StatefulSet/PVC is
  # recreated during the manual cutover phase.
  storageClass: rejourney-db-local-retain

master:
  persistence:
    size: 8Gi
  configuration: |
    # BullMQ stores durable queue/job state in Redis. Never evict queue keys.
    maxmemory 2gb
    maxmemory-policy noeviction
    # Keep the shared AOF-only persistence policy from commonConfiguration.
  # See sentinel.resourcesPreset note above — same override applies here.
  # Node now has 12 CPU / 24 GiB. Redis is still far from its ceiling in prod,
  # but we give it a bit more burst room so it doesn't become the next avoidable
  # bottleneck while Postgres/API use the extra headroom.
  resourcesPreset: "none"
  resources:
    requests:
      cpu: 75m
      memory: 512Mi
    limits:
      cpu: "1500m"
      memory: 3Gi

auth:
  existingSecret: redis-secret
  existingSecretPasswordKey: REDIS_PASSWORD

metrics:
  enabled: true           # deploys redis-exporter sidecar; scraped by VictoriaMetrics on port 9121
  image:
    digest: sha256:d768e44e2e0aff5bcb2bce39609e4877b7ac2cf000670dbaea794da2e35e0e7a
  serviceMonitor:
    enabled: false        # we use VictoriaMetrics static scrape, not prometheus-operator
  resourcesPreset: "none"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
