# CloudNativePG Cluster manifest for the active local-storage primary.
#
# IMPORTANT: This file is applied by deploy-release.sh via an explicit
# k8s/cnpg/postgres-cnpg.yaml step after the root manifests/prereqs. We keep it
# in a subdirectory so the main root-level apply/prune pass does not touch the
# CNPG CR before the operator is installed.
#
# The bootstrap / external cluster fields are intentionally retained because the
# live `postgres-local` cluster was created via pg_basebackup from `postgres`
# during the storage cutover. Keeping the reconciled spec aligned avoids
# surprise diffs on the next CI deploy.

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-local
  namespace: rejourney
  labels:
    app.kubernetes.io/part-of: rejourney
spec:
  # Temporary: the second instance cannot fit on the current HEL1 worker disk.
  # Restore this to 2 after that node's storage has been expanded.
  instances: 1

  # Sync replication: primary waits for the standby (worker-1, HEL1) to confirm
  # it has received and written WAL to its OS buffer before acking the commit.
  # Uses remote_write (not remote_apply) to cap the added latency to ~1 RTT
  # (~25ms FSN1→HEL1) rather than full apply time. Only write transactions are
  # affected — reads are unchanged. Prevents data loss on hard FSN1 failure at
  # the cost of ~25ms added to write-heavy paths (observed API p50 140ms → ~165ms).
  # maxSyncReplicas=1 lets postgres proceed if the standby is temporarily down
  # (e.g., during a CNPG rolling upgrade) rather than blocking all writes forever.
  # Temporary single-instance mode; restore both values to 1 with instances: 2.
  minSyncReplicas: 0
  maxSyncReplicas: 0

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  # Must match the existing Postgres major version.
  # Current cluster runs PostgreSQL 18.1. Verify CNPG version supports PG 18
  # before installing (CNPG 1.25 supports up to PG 17; use 1.26+ for PG 18).
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  postgresql:
    parameters:
      max_connections: "200"
      # remote_write: wait for standby OS buffer write, not fsync. Paired with
      # minSyncReplicas=1 above. Faster than 'on' (no standby fsync wait) while
      # still preventing data loss on primary crash. See minSyncReplicas comment.
      synchronous_commit: "remote_write"
      shared_buffers: "4GB"
      effective_cache_size: "12GB"
      work_mem: "32MB"
      # CNPG automatically manages shared_preload_libraries for pg_stat_statements
      # when pg_stat_statements.* settings are present.
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: "all"
      # Autovacuum tuning — higher cost limit means vacuum runs faster per cycle,
      # more workers means more tables can be cleaned concurrently.
      # Per-table scale_factor overrides are set via ALTER TABLE in migrations.
      autovacuum_vacuum_cost_limit: "800"
      autovacuum_max_workers: "5"
      # Reduced from 512MB — at 5 autovacuum workers this was consuming up to
      # 2.56GB of the 12Gi pod limit. 128MB is still plenty for vacuuming
      # large tables; speed is controlled by cost_limit, not work_mem.
      maintenance_work_mem: "128MB"
      # Capped to match the 6-vCPU pod limit. 32 was pure overhead.
      max_parallel_workers: "6"
      max_worker_processes: "8"
      # Caps temp file spill per session. Prevents a single runaway query from
      # filling the node disk (incident: one query spilled 347GB before eviction).
      # 50GB is well above any legitimate query need given the ~48GB database size.
      temp_file_limit: "50GB"
      # Log any query that spills more than 1GB to disk for early visibility.
      log_temp_files: "1GB"

  resources:
    requests:
      cpu: "1500m"
      memory: "8Gi"
    limits:
      cpu: "6"
      # Raised from 12Gi — primary was at 99.4% (11.93Gi used). Node has 24Gi
      # total at 65% utilisation so headroom exists. Combined with the
      # maintenance_work_mem reduction this gives a real safety margin.
      memory: "16Gi"

  storage:
    storageClass: rejourney-db-local-retain
    size: 100Gi

  bootstrap:
    pg_basebackup:
      database: rejourney
      owner: rejourney
      secret:
        name: postgres-app-secret
      source: postgres

  replica:
    enabled: false
    source: postgres

  externalClusters:
    - name: postgres
      connectionParameters:
        host: postgres-rw.rejourney.svc.cluster.local
        user: streaming_replica
        dbname: postgres
        sslmode: verify-full
      sslKey:
        name: postgres-replication
        key: tls.key
      sslCert:
        name: postgres-replication
        key: tls.crt
      sslRootCert:
        name: postgres-ca
        key: ca.crt

  backup:
    barmanObjectStore:
      destinationPath: s3://rejourney-db-backups-1/postgres/cnpg
      s3Credentials:
        accessKeyId:
          name: db-backup-secret
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: db-backup-secret
          key: AWS_SECRET_ACCESS_KEY
      endpointURL: https://s3.us-west-or.io.cloud.ovh.us
      wal:
        compression: gzip
    # Current OVH backup-bucket sizing cannot hold 30 days of daily base
    # backups plus WAL. Seven days keeps the recovery window explicit while
    # avoiding a storage upgrade at the current database growth rate.
    retentionPolicy: "7d"
