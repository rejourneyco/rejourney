name: Rejourney CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production release halfway through. Superseded PR checks
  # can be cancelled, while pushes to main are serialized in commit order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web
  MIGRATION_IMAGE: ghcr.io/${{ github.repository }}/migration
  RESEARCH_LAKE_COMPACTOR_IMAGE: ghcr.io/${{ github.repository }}/research-lake-compactor
  # Public ED25519 host key for the production VPS. Update deliberately when the
  # server host key is rotated; never replace this with runtime ssh-keyscan.
  VPS_SSH_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBXUAJEpy6J0613oSrn8Xc/sIwBbZ18HHoQJEPLJk1B2

jobs:
  # ------------------------------------------------------------------
  # VERSION CHECK (Root)
  # Required GitHub secrets:
  #   VPS_SSH_KEY — private key for SSH auth (root@VPS)
  #   VPS_HOST    — VPS host / IP (set to Tailscale IP if SSH is locked to tailnet)
  # ------------------------------------------------------------------
  check-version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      changed: ${{ steps.version-check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH Key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s %s\n' "${{ secrets.VPS_HOST }}" "${{ env.VPS_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Compare with VPS Version
        id: version-check
        run: |
           LOCAL_VERSION=$(jq -r .version package.json)

           echo "Fetching version from VPS..."
           REMOTE_VERSION="0.0.0"

           # The success marker is written only after deploy-release completes.
           # Fall back to package.json once for servers deployed before the marker
           # was introduced.
           SSH_OPTIONS=(
             -o BatchMode=yes
             -o ConnectTimeout=15
             -o IdentitiesOnly=yes
             -o StrictHostKeyChecking=yes
             -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
             -i "$HOME/.ssh/id_rsa"
           )

           REMOTE_MARKER_STATUS=0
           ssh "${SSH_OPTIONS[@]}" root@"${{ secrets.VPS_HOST }}" "test -f /var/lib/rejourney/deployed-version" || REMOTE_MARKER_STATUS=$?
           if [ "$REMOTE_MARKER_STATUS" -eq 0 ]; then
             REMOTE_VERSION=$(ssh "${SSH_OPTIONS[@]}" root@"${{ secrets.VPS_HOST }}" "cat /var/lib/rejourney/deployed-version")
           elif [ "$REMOTE_MARKER_STATUS" -eq 1 ]; then
             REMOTE_FILE_STATUS=0
             ssh "${SSH_OPTIONS[@]}" root@"${{ secrets.VPS_HOST }}" "test -f /opt/rejourney/package.json" || REMOTE_FILE_STATUS=$?
             if [ "$REMOTE_FILE_STATUS" -eq 0 ]; then
               ssh "${SSH_OPTIONS[@]}" root@"${{ secrets.VPS_HOST }}" "cat /opt/rejourney/package.json" > remote_package.json
               if [ -s remote_package.json ]; then
                 REMOTE_VERSION=$(jq -r .version remote_package.json)
               fi
               echo "No deployment marker found; using package.json for this compatibility rollout."
             elif [ "$REMOTE_FILE_STATUS" -eq 1 ]; then
               echo "⚠️ No deployment marker or package.json found on VPS. Assuming first deployment."
             else
               echo "Failed to verify the VPS package version over authenticated SSH (exit ${REMOTE_FILE_STATUS})."
               exit "$REMOTE_FILE_STATUS"
             fi
           else
             echo "Failed to verify the VPS deployment marker over authenticated SSH (exit ${REMOTE_MARKER_STATUS})."
             exit "$REMOTE_MARKER_STATUS"
           fi

           if [ -z "$REMOTE_VERSION" ] || [ "$REMOTE_VERSION" = "null" ]; then
             echo "The remote deployment version is empty or invalid."
             exit 1
           fi

           echo "Local Version: $LOCAL_VERSION"
           echo "Remote Version: $REMOTE_VERSION"

           if [ "$LOCAL_VERSION" != "$REMOTE_VERSION" ]; then
             echo "changed=true" >> $GITHUB_OUTPUT
             echo "✅ Version changed. Deploy required."
           else
             echo "changed=false" >> $GITHUB_OUTPUT
             echo "zzz Version unchanged. Skipping."
           fi

  # ------------------------------------------------------------------
  # BACKEND JOBS
  # ------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --workspace rejourney-backend --include-workspace-root=false --ignore-scripts

      - name: Dependency Audit
        run: npm audit --audit-level=high

      - name: Schema / Migration Guard
        run: |
          node scripts/check-worker-parity.mjs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            bash scripts/check-schema-migration.sh --range "origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            bash scripts/check-schema-migration.sh --range "${{ github.event.before }}...HEAD"
          else
            bash scripts/check-schema-migration.sh
          fi

      - name: Lint
        working-directory: ./backend
        run: npm run lint --if-present

      - name: Build
        working-directory: ./backend
        run: npm run build

      - name: Unit Tests
        working-directory: ./backend
        run: npm test

      - name: Billing Tests
        working-directory: ./backend
        run: npm test -- --testNamePattern="billing|Billing|renewal|Renewal|downgrade|Downgrade" --reporter=verbose

      - name: Lint Billing Code
        working-directory: ./backend
        run: npx eslint src/services/stripe.ts src/services/stripeProducts.ts src/utils/billing.ts --max-warnings=0

  # ------------------------------------------------------------------
  # WEB JOBS
  # ------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --workspace @rejourneyco/browser --workspace rejourney-dashboard --include-workspace-root=false --ignore-scripts

      - name: Build Web SDK
        working-directory: ./packages/browser
        run: npm run prepack

      - name: TypeScript check
        working-directory: ./dashboard/web-ui
        run: npm run typecheck

      - name: Build Web (SSR)
        working-directory: ./dashboard/web-ui
        run: npm run build

  # ------------------------------------------------------------------
  # K8S / DEPLOY CONFIG CHECKS
  # ------------------------------------------------------------------
  k8s-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Validate Storage Cutover Config
        run: |
          bash scripts/k8s/validate-storage-cutover.sh
          bash scripts/ci/check-repository-hygiene.sh
          bash scripts/ci/check-secret-hygiene.sh
          node scripts/ci/check-docs-integrity.mjs


  # ------------------------------------------------------------------
  # DOCKER BUILD
  # ------------------------------------------------------------------
  build-images:
    needs: [backend, web, k8s-config, check-version]
    if: success() && github.ref == 'refs/heads/main' && (needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dashboard/web-ui/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
             VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
             VITE_DASHBOARD_URL=https://rejourney.co/dashboard
             VITE_API_URL=https://api.rejourney.co
             VITE_DOCS_URL=https://rejourney.co/docs
             VITE_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Migration
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.migration
          push: true
          tags: |
            ${{ env.MIGRATION_IMAGE }}:latest
            ${{ env.MIGRATION_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Research Lake Compactor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/research_lake_compactor/Dockerfile
          push: true
          tags: |
            ${{ env.RESEARCH_LAKE_COMPACTOR_IMAGE }}:latest
            ${{ env.RESEARCH_LAKE_COMPACTOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # DEPLOY TO VPS
  # ------------------------------------------------------------------
  deploy:
    needs: [build-images, check-version]
    if: success() && github.ref == 'refs/heads/main' && (needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Install pinned VPS SSH credentials
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}"
          test -n "${VPS_SSH_KEY}"

          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_KEY}" | tr -d '\r' > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"
          printf '%s %s\n' "${VPS_HOST}" "${VPS_SSH_HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          # Fail before the rollout if the secret is not a usable private key.
          ssh-keygen -y -f "${HOME}/.ssh/deploy_key" >/dev/null
          ssh-keygen -lf "${HOME}/.ssh/known_hosts" -E sha256

      - name: Deploy exact release to VPS
        timeout-minutes: 65
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          if [[ ! "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: ${IMAGE_TAG}"
            exit 1
          fi
          if [[ ! "${REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid GitHub repository name: ${REPOSITORY}"
            exit 1
          fi

          SSH_OPTIONS=(
            -T
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=3
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o HostKeyAlgorithms=ssh-ed25519
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -i "${HOME}/.ssh/deploy_key"
          )

          # Values are validated above and shell-escaped before becoming remote
          # environment assignments. The quoted heredoc prevents local expansion
          # of any command in the deployment program.
          printf -v REMOTE_COMMAND 'IMAGE_TAG=%q REPOSITORY=%q bash -s' "${IMAGE_TAG}" "${REPOSITORY}"
          ssh "${SSH_OPTIONS[@]}" root@"${VPS_HOST}" "${REMOTE_COMMAND}" <<'REMOTE_SCRIPT'
             set -euo pipefail

             if [[ ! "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
               echo "Invalid remote release SHA: ${IMAGE_TAG}"
               exit 1
             fi
             if [[ ! "${REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
               echo "Invalid remote repository name: ${REPOSITORY}"
               exit 1
             fi

             DEPLOYED_VERSION_DIR=/var/lib/rejourney
             DEPLOYED_VERSION_FILE="${DEPLOYED_VERSION_DIR}/deployed-version"

             write_deployed_version() {
               local version="$1"
               local marker_tmp
               marker_tmp=$(mktemp "${DEPLOYED_VERSION_DIR}/deployed-version.XXXXXX")
               printf '%s\n' "${version}" > "${marker_tmp}"
               chmod 644 "${marker_tmp}"
               mv -f "${marker_tmp}" "${DEPLOYED_VERSION_FILE}"
             }

             # Bootstrap the out-of-worktree success marker from the currently
             # deployed checkout before changing it. A failed first rollout then
             # retains the previous version and remains retryable.
             if [ ! -f "${DEPLOYED_VERSION_FILE}" ]; then
               PREVIOUS_DEPLOYED_VERSION=0.0.0
               if [ -f /opt/rejourney/package.json ]; then
                 PREVIOUS_DEPLOYED_VERSION=$(python3 -c 'import json; print(json.load(open("/opt/rejourney/package.json"))["version"])')
               fi
               install -m 755 -d "${DEPLOYED_VERSION_DIR}"
               write_deployed_version "${PREVIOUS_DEPLOYED_VERSION}"
             fi

             # Update Repo
             # Ensure the directory exists
             if [ ! -d "/opt/rejourney" ]; then
               echo "Directory /opt/rejourney not found, cloning..."
               git clone "https://github.com/${REPOSITORY}.git" /opt/rejourney
             fi

             # SAFE CD: Exit if cd fails
             cd /opt/rejourney || exit 1

             # Public, tokenless origin. Never persist CI tokens in the VPS git config.
             git remote set-url origin "https://github.com/${REPOSITORY}.git"

             # If it's not a git repo, initialize it (fallback)
             if [ ! -d ".git" ]; then
               echo "Not a git repository, fixing..."
               # CAREFUL: Only delete if we are CONFIRMED in /opt/rejourney
               if [ "$(pwd)" == "/opt/rejourney" ]; then
                   rm -rf * .[^.]*
                   git clone "https://github.com/${REPOSITORY}.git" .
               else
                   echo "CRITICAL ERROR: Wrong directory $(pwd). Aborting wipe."
                   exit 1
               fi
             fi

             # Deploy the exact commit whose images passed CI. origin/main may
             # already point at a newer push by the time this queued job runs.
             git fetch --no-tags origin "${IMAGE_TAG}"
             git reset --hard "${IMAGE_TAG}"
             git clean -ffd
             if [ "$(git rev-parse HEAD)" != "${IMAGE_TAG}" ]; then
               echo "CRITICAL ERROR: checkout does not match image tag ${IMAGE_TAG}"
               exit 1
             fi

             bash scripts/k8s/deploy-release.sh "${IMAGE_TAG}" "${REPOSITORY}"

             # Commit the deployed version only after migrations and every
             # workload rollout have succeeded. Rename is atomic on this volume.
             DEPLOYED_VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
             write_deployed_version "${DEPLOYED_VERSION}"

             # Clean up old images
             echo "🧹 Cleaning up old images..."
             if command -v crictl &> /dev/null; then
               crictl rmi --prune
             elif command -v docker &> /dev/null; then
               docker image prune -af --filter "until=24h"
             fi

             # ============================================
             # CLEANUP: Run after every deployment
             # ============================================
             echo "🧹 Running post-deploy cleanup..."

             # 1. Clean up completed/failed pods
             echo "  → Cleaning completed pods..."
             kubectl delete pods -n rejourney --field-selector=status.phase==Succeeded --ignore-not-found
             kubectl delete pods -n rejourney --field-selector=status.phase==Failed --ignore-not-found

             # 2. Clean up old debug pods (using kubectl native approach, no jq needed)
             echo "  → Cleaning stale debug pods..."
             kubectl get pods -n rejourney --no-headers -o custom-columns=":metadata.name" | grep "^debug-" | xargs -r kubectl delete pod -n rejourney --ignore-not-found || true

             # 3. Clean up old completed job pods (keep last 3)
             echo "  → Cleaning old job pods..."
             kubectl get pods -n rejourney -o name | grep -E 'postgres-backup-|db-setup' | head -n -3 | xargs -r kubectl delete -n rejourney --ignore-not-found || true

             # 4. Restart session-backup-seed: kill any running pods/jobs so they pick up
             #    the updated ConfigMap (session-backup-script) immediately instead of waiting
             #    for the next cron tick. The CronJob will reschedule automatically.
             echo "  → Restarting session-backup-seed pods to pick up new script..."
             kubectl get jobs -n rejourney --no-headers -o custom-columns=":metadata.name" \
               | grep "^session-backup-seed-" \
               | xargs -r kubectl delete job -n rejourney --ignore-not-found || true
             kubectl delete pods -n rejourney -l job-name \
               --field-selector=status.phase==Running \
               --selector='app in (session-backup-seed)' --ignore-not-found 2>/dev/null || true
             # Also kill any stuck long-running session-backup (drain-queue) jobs older than 23h
             # that pre-date the current deploy and are running with the old script.
             echo "  → Clearing stale session-backup drain jobs..."
             kubectl get jobs -n rejourney --no-headers \
               -o custom-columns=":metadata.name,:metadata.creationTimestamp" \
               | grep "^session-backup-[0-9]" \
               | awk -v cutoff="$(date -u -d '23 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-23H +%Y-%m-%dT%H:%M:%SZ)" \
                   '$2 < cutoff {print $1}' \
               | xargs -r kubectl delete job -n rejourney --ignore-not-found || true

             # 5. Clean containerd garbage (exited containers)
             echo "  → Cleaning exited containers..."
             if command -v crictl &> /dev/null; then
               crictl rm $(crictl ps -a -q --state exited) 2>/dev/null || true
             fi

             echo "✅ Cleanup complete!"
          REMOTE_SCRIPT
